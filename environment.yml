name: mpm-dino-poc
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip>=24.0
  - pip:
      # Keep the numerical stack on pip wheels. Mixing Conda OpenBLAS/LLVM
      # OpenMP with PyTorch's bundled OpenMP aborts on Apple Silicon.
      - numpy==1.26.4
      - scipy==1.15.3
      # PyTorch 2.8 supports Apple Silicon/MPS without a separate CUDA build.
      - torch==2.8.0
      - torchvision==0.23.0
      - transformers==4.57.0
      - huggingface-hub>=0.34,<1.0
      - safetensors>=0.5,<1.0
      - accelerate>=1.10,<2.0
      - opencv-python-headless==4.11.0.86
      - pillow>=11.0,<13.0
      - pytest>=8.4,<9.0
